name: Refresh sponsorship data

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/dashboard.json"
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *"

permissions:
  contents: write

concurrency:
  group: sponsorship-tracking-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate production source
        run: npm run validate
      - name: Generate verified Shopify dataset
        env:
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
          SPONSORSHIP_START_DATE: ${{ vars.SPONSORSHIP_START_DATE }}
          CORRO_SHOPIFY_STORE: ${{ secrets.CORRO_SHOPIFY_STORE }}
          CORRO_SHOPIFY_ACCESS_TOKEN: ${{ secrets.CORRO_SHOPIFY_ACCESS_TOKEN }}
          CAVALI_SHOPIFY_STORE: ${{ secrets.CAVALI_SHOPIFY_STORE }}
          CAVALI_SHOPIFY_ACCESS_TOKEN: ${{ secrets.CAVALI_SHOPIFY_ACCESS_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync-data
      - name: Build protected static site
        run: npm run build
      - name: Publish verified dataset for Cloudflare Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if git diff --cached --quiet; then
            echo "No sponsorship data changes to publish."
          else
            git commit -m "chore: refresh verified sponsorship data [skip ci]"
            git push origin HEAD:main
          fi
