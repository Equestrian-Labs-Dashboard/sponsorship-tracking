name: Refresh sponsorship data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *"

permissions:
  contents: read

concurrency:
  group: sponsorship-tracking-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate production source
        run: npm run validate
      - name: Generate verified Shopify dataset
        env:
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
          SPONSORSHIP_START_DATE: ${{ vars.SPONSORSHIP_START_DATE }}
          CORRO_SHOPIFY_STORE: ${{ secrets.CORRO_SHOPIFY_STORE }}
          CORRO_SHOPIFY_ACCESS_TOKEN: ${{ secrets.CORRO_SHOPIFY_ACCESS_TOKEN }}
          CAVALI_SHOPIFY_STORE: ${{ secrets.CAVALI_SHOPIFY_STORE }}
          CAVALI_SHOPIFY_ACCESS_TOKEN: ${{ secrets.CAVALI_SHOPIFY_ACCESS_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync-data
      - name: Build protected static site
        run: npm run build
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=sponsorship-tracking-report --branch=main
