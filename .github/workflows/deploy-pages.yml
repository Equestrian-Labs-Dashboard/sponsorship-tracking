name: Build data and deploy dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20



      - name: Install dependencies
        run: npm install



      - name: Generate dashboard data
        env:

          GOOGLE_SHEET_ID:
            ${{ secrets.GOOGLE_SHEET_ID }}

          GOOGLE_SERVICE_ACCOUNT_JSON:
            ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

          CORRO_SHOPIFY_STORE:
            ${{ secrets.CORRO_SHOPIFY_STORE }}

          CORRO_SHOPIFY_ACCESS_TOKEN:
            ${{ secrets.CORRO_SHOPIFY_ACCESS_TOKEN }}

          CAVALI_SHOPIFY_STORE:
            ${{ secrets.CAVALI_SHOPIFY_STORE }}

          CAVALI_SHOPIFY_ACCESS_TOKEN:
            ${{ secrets.CAVALI_SHOPIFY_ACCESS_TOKEN }}


        run: npm run sync-data




      - name: Configure Pages
        uses: actions/configure-pages@v5




      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .




      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
