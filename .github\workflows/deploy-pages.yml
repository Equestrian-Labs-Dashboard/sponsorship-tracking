name: Sponsorship Tracker - Google Sheets Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20


    - name: Install
      run:
        npm install


    - name: Generate dashboard data
      env:

        GOOGLE_SHEET_ID:
          ${{ secrets.GOOGLE_SHEET_ID }}

        GOOGLE_SERVICE_ACCOUNT_JSON:
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        CORRO_SHOPIFY_STORE:
          ${{ secrets.CORRO_SHOPIFY_STORE }}

        CORRO_SHOPIFY_ACCESS_TOKEN:
          ${{ secrets.CORRO_SHOPIFY_ACCESS_TOKEN }}

        CAVALI_SHOPIFY_STORE:
          ${{ secrets.CAVALI_SHOPIFY_STORE }}

        CAVALI_SHOPIFY_ACCESS_TOKEN:
          ${{ secrets.CAVALI_SHOPIFY_ACCESS_TOKEN }}


      run:

        npm run sync-data

- name: Verify generated files
  run: |
    ls -la
    ls -la data

    - name: Configure Pages
      uses: actions/configure-pages@v5


    - name: Upload
      uses: actions/upload-pages-artifact@v3
      with:
        path: .


    - name: Deploy
      uses: actions/deploy-pages@v4
